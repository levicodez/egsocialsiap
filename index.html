<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela de Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background: #6200ea;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      border-radius: 4px;
    }

    button:hover {
      background: #4500a8;
    }

    .mensagem-erro {
      margin-top: 15px;
      color: #fff;
      background: #e53935;
      padding: 10px;
      border-radius: 4px;
      display: none; /* escondido no início */
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <input type="text" placeholder="Usuário" id="usuario">
    <input type="password" placeholder="Senha" id="senha">
    <button onclick="mostrarErro()">Entrar</button>
    <div id="erro" class="mensagem-erro"></div>
  </div>

  <script>
    function mostrarErro() {
      const mensagem = document.getElementById('erro');
      mensagem.textContent = 'Erro: Sistema sofrendo atualizações!';
      mensagem.style.display = 'block';
    }
  </script>

</body>
</html>
